<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade Principal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">
    
</head>
<body class="bg-danger-subtle">
    <h1 class="text-center mt-5 mb-5"> Formulário de Cadastro </h1>
    <main class="container mt-5 mb-5"> 
<p>
    Prencha este campo.
</p>
<form id="formCadastro">

    <div class="mb-3">
        <label for="nome" class="form-label">
            Nome
        </label>
        <input type="text" class="form-control" id="nome"
        placeholder="Digite seu nome"
        required>

    </div>
    
    <div class="mb-3">
        <label for="email" class="form-label">
            E-mail
        </label>
        <input type="email" class="form-control" id="email"
        placeholder="nome@email.com"
        required>

    </div>
    <div class="mb-3">
        <label for="telefone" class="form-label">
            Telefone
        </label>
        <input type="tel" class="form-control" id="telefone"
        placeholder="(47) 9999-9999">

    </div>
    <div class="mb-3">
        <label for="cidade" class="form-label">
            Cidade
        </label>
        <select id="cidade"
        class="form-select" required>
        <option value="">Selecione uma cidade</option>
        <option value="1">Brusque</option>
        <option value="2">Itajai</option>
        <option value="3">Blumenau</option>
        <option value="4">Gaspar</option>
    </select>
    </div>
    <div class="mb-3">
        <label for="observacao" class="form-label">
            Observação
        </label>
        <textarea 
        id="observacao"
        class="form-control"
        rows="4"
        placeholder="Digite uma Obeservação"
        >
</textarea>
    </div>

    <button type="submit"
            class="btn btn-primary w-100">
            Enviar
    </button>

    <div id="mensagemSucesso"
    class="alert alert-success mt-3 d-none" role="alert">
Cadastro efetuado com sucesso!
</div>
</main>
<script src="js/app.js"></script>
</body>
</html>
